<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SU Academy – パスワード再設定</title>
</head>

<body style="margin:0;padding:0;background-color:#fef3c7;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding:40px 10px">

        <table width="600" cellpadding="0" cellspacing="0"
               style="background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,0.08);">

          <!-- HEADER -->
          <tr>
            <td style="background:#f97316;color:white;text-align:center;padding:24px">
              <h1 style="margin:0;font-size:28px;">SU Academy</h1>
              <p style="margin:6px 0 0;font-size:14px;">
                語学学習プラットフォーム
              </p>
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:32px;color:#111;">
              <h2 style="margin-top:0;">パスワード再設定 🔐</h2>

              <p style="font-size:15px;line-height:1.6;">
                SU Academy アカウントのパスワード再設定リクエストを受け付けました。
                以下のボタンをクリックして、新しいパスワードを設定してください。
              </p>

              <!-- BUTTON -->
              <div style="text-align:center;margin:32px 0;">
                <a href="{{ reset_link }}"
                   style="
                     display:inline-block;
                     padding:14px 34px;
                     background-color:#f97316;
                     color:#ffffff;
                     text-decoration:none;
                     font-size:16px;
                     font-weight:bold;
                     border-radius:8px;
                   ">
                  パスワードを再設定
                </a>
              </div>

              <p style="font-size:14px;color:#555;line-height:1.6;">
                ⏱ このリンクは <b>15 分間</b> 有効です。<br>
                心当たりがない場合は、このメールを無視してください。
              </p>

              <p style="margin-top:28px;">
                よろしくお願いいたします。<br>
                <b>SU Academy チーム</b>
              </p>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background:#fff7ed;text-align:center;padding:16px;font-size:12px;color:#666;">
              © 2025 SU Academy. All rights reserved.
            </td>
          </tr>

        </table>

        <p style="margin-top:20px;font-size:12px;color:#888;">
          このメールは自動送信されています。返信しないでください。
        </p>

      </td>
    </tr>
  </table>
</body>
</html>
