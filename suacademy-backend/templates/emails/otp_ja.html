<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>SU Academy – 認証コード</title>
</head>
<body style="margin:0;padding:0;background:#fff7ed;font-family:Arial;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center">
        <table width="600" style="background:#ffffff;border-radius:10px;overflow:hidden">

          <!-- HEADER -->
          <tr>
            <td style="background:#f97316;padding:20px;text-align:center;color:white">
              <h1 style="margin:0">SU Academy</h1>
              <p style="margin:0;font-size:14px">語学学習プラットフォーム</p>
            </td>
          </tr>

          <!-- CONTENT -->
          <tr>
            <td style="padding:30px;color:#111">
              <h2>こんにちは 👋</h2>
              <p>
                SU Academy への登録ありがとうございます。
                以下の 6 桁の認証コードを入力してください。
              </p>

              <div style="
                margin:30px 0;
                font-size:32px;
                font-weight:bold;
                letter-spacing:6px;
                text-align:center;
                color:#f97316;
              ">
                {{ code }}
              </div>

              <p style="font-size:14px;color:#555">
                このコードは 5 分間有効です。
                心当たりがない場合は、このメールを無視してください。
              </p>

              <p style="margin-top:30px">
                よろしくお願いします。<br>
                <b>SU Academy チーム</b>
              </p>
            </td>
          </tr>

          <!-- FOOTER -->
          <tr>
            <td style="background:#fff3e0;padding:15px;text-align:center;font-size:12px;color:#666">
              © 2025 SU Academy
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
